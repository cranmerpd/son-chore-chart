<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Mission Control</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .settings-page { max-width: 960px; margin: 0 auto; padding: 24px 20px 40px; }
    .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; animation: fadeIn 0.4s ease; }
    .panel h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 16px; }
    .member-row, .chore-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); animation: fadeIn 0.3s ease; }
    .member-row:last-child, .chore-row:last-child { border-bottom: none; }
    .chore-info { flex: 1; min-width: 0; }
    .chore-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
    .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .small-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; }
    .small-btn:hover { border-color: var(--accent); }
    .small-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); animation: fadeIn 0.2s ease; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; animation: fadeIn 0.25s ease; }
    .modal-box h3 { margin-bottom: 16px; }
    .form-row { display: flex; flex-direction: column; gap: 10px; }
    .form-row input, .form-row select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-family: inherit; transition: border-color 0.2s; }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--accent); }
    .day-checks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .day-checks label { font-size: 0.75rem; display: flex; align-items: center; gap: 4px; }
    @media (max-width: 640px) {
      .settings-page { padding: 16px 12px 32px; }
      .row-actions { flex-wrap: wrap; }
      .small-btn { padding: 4px 8px; }
    }
  </style>
</head>
<body>
  <div class="settings-page">
    <header class="settings-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <div>
          <h1>Settings</h1>
          <p class="tagline">Family Management</p>
        </div>
      </div>
      <div class="header-stats">
        <a href="index.html" class="stat clickable" style="text-decoration: none;">
          <span class="stat-label">Chart</span>
          <span class="stat-value">←</span>
        </a>
        <div class="stat clickable" id="logout-btn">
          <span class="stat-label">Out</span>
          <span class="stat-value">→</span>
        </div>
      </div>
    </header>

    <div id="login-required" style="text-align: center; padding: 60px 20px; display: none;">
      <p>Sign in as a parent to manage the family.</p>
      <a href="index.html" class="primary-btn" style="display: inline-block; margin-top: 16px; text-decoration: none;">Go to Login</a>
    </div>

    <div id="settings-content" style="display: none;">
      <div class="two-col">
        <div class="panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h2 style="margin: 0;">Family Members</h2>
            <button id="open-add-member" class="primary-btn" style="padding: 6px 14px; font-size: 0.85rem; margin: 0;">+ Add</button>
          </div>
          <div id="members-list"></div>
        </div>

        <div class="panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h2 style="margin: 0;">Chores</h2>
            <button id="open-add-chore" class="primary-btn" style="padding: 6px 14px; font-size: 0.85rem; margin: 0;">+ Add</button>
          </div>
          <div id="chore-settings-list"></div>
        </div>
      </div>

      <div class="panel" style="margin-top: 24px;">
        <h2>Badges</h2>
        <div id="badges-list"></div>
        <form id="add-badge-form" class="form-row" style="margin-top: 16px;">
          <input type="text" id="badge-name" placeholder="Badge name" required>
          <input type="text" id="badge-icon" placeholder="Icon (emoji)">
          <input type="text" id="badge-desc" placeholder="Description">
          <select id="badge-type">
            <option value="totalChecks">Total chores</option>
            <option value="fullDays">Full days</option>
            <option value="streak">Streak</option>
            <option value="fullWeeks">Full weeks</option>
            <option value="perfectWeeks">Perfect weeks</option>
            <option value="totalEarned">Total earned ($)</option>
          </select>
          <input type="number" id="badge-threshold" placeholder="Threshold" min="1" required>
          <button type="submit" class="primary-btn">Add Badge</button>
        </form>
      </div>
    </div>

    <p class="version">v1.2</p>
  </div>

  <!-- Add Member Modal -->
  <div id="add-member-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Add Family Member</h3>
      <form id="add-member-form" class="form-row">
        <input type="text" id="member-username" placeholder="Username" required>
        <input type="password" id="member-password" placeholder="Password" required>
        <select id="member-role">
          <option value="child">Child</option>
          <option value="parent">Parent</option>
        </select>
        <button type="submit" class="primary-btn">Create Account</button>
      </form>
      <p id="member-error" class="auth-error"></p>
      <button id="close-add-member" class="ghost-btn" style="margin-top: 12px; width: 100%;">Cancel</button>
    </div>
  </div>

  <!-- Allowance Modal -->
  <div id="allowance-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Set Weekly Allowance</h3>
      <form id="allowance-form" class="form-row">
        <input type="hidden" id="allowance-uid">
        <label style="font-size: 0.85rem; color: var(--text-dim);">Amount ($)</label>
        <input type="number" id="allowance-amount" min="0" step="0.50" required>
        <button type="submit" class="primary-btn">Save</button>
      </form>
      <button id="close-allowance" class="ghost-btn" style="margin-top: 12px; width: 100%;">Cancel</button>
    </div>
  </div>

  <!-- Add/Edit Chore Modal -->
  <div id="chore-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="chore-modal-title">Add Chore</h3>
      <form id="chore-form" class="form-row">
        <input type="hidden" id="chore-id">
        <input type="text" id="chore-name" placeholder="Chore name" required>
        <select id="chore-section">
          <option value="morning">Morning</option>
          <option value="evening">Evening</option>
          <option value="weekly">Weekly</option>
        </select>
        <select id="chore-frequency">
          <option value="daily">Daily</option>
          <option value="weekdays">Weekdays</option>
          <option value="weekly">Weekly</option>
          <option value="specific">Specific days</option>
        </select>
        <div id="day-selector" class="day-checks" style="display: none;">
          <label><input type="checkbox" value="0"> Sun</label>
          <label><input type="checkbox" value="1"> Mon</label>
          <label><input type="checkbox" value="2"> Tue</label>
          <label><input type="checkbox" value="3"> Wed</label>
          <label><input type="checkbox" value="4"> Thu</label>
          <label><input type="checkbox" value="5"> Fri</label>
          <label><input type="checkbox" value="6"> Sat</label>
        </div>
        <select id="chore-assign">
          <option value="all">Everyone</option>
        </select>
        <button type="submit" class="primary-btn">Save Chore</button>
      </form>
      <button id="close-chore-modal" class="ghost-btn" style="margin-top: 12px; width: 100%;">Cancel</button>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
