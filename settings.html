<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Mission Control</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .settings-page { max-width: 1100px; margin: 0 auto; padding: 24px 20px 40px; }
    .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: 280px 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .panel h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin: 0; }
    .list { max-height: 420px; overflow-y: auto; }
    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px; }
    .row:last-child { border-bottom: none; }
    .row-info { flex: 1; min-width: 0; }
    .row-title { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-meta { font-size: 0.7rem; color: var(--text-dim); margin-top: 1px; }
    .row-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); width: 28px; height: 28px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; display: grid; place-items: center; transition: all 0.15s; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
    .add-btn { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b0f19; border: none; padding: 5px 12px; border-radius: 6px; font-family: inherit; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; }
    .modal-box h3 { margin-bottom: 16px; font-size: 1.1rem; }
    .form-row { display: flex; flex-direction: column; gap: 10px; }
    .form-row input, .form-row select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-family: inherit; }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--accent); }
    .form-row input[type="number"] { -moz-appearance: textfield; }
    .form-row input[type="number"]::-webkit-outer-spin-button,
    .form-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .day-checks { display: flex; gap: 8px; flex-wrap: wrap; }
    .day-checks label { font-size: 0.75rem; display: flex; align-items: center; gap: 3px; }
    .inactive { opacity: 0.45; }
  </style>
</head>
<body>
  <div class="settings-page">
    <header class="settings-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <div>
          <h1>Settings</h1>
          <p class="tagline">Family Management</p>
        </div>
      </div>
      <div class="header-stats">
        <a href="index.html" class="stat clickable" style="text-decoration: none;">
          <span class="stat-label">Chart</span>
          <span class="stat-value">←</span>
        </a>
        <div class="stat clickable" id="logout-btn">
          <span class="stat-label">Out</span>
          <span class="stat-value">→</span>
        </div>
      </div>
    </header>

    <div id="login-required" style="text-align: center; padding: 60px 20px; display: none;">
      <p>Sign in as a parent to manage the family.</p>
      <a href="index.html" class="primary-btn" style="display: inline-block; margin-top: 16px; text-decoration: none;">Go to Login</a>
    </div>

    <div id="settings-content" style="display: none;">
      <div class="grid">
        <div class="panel">
          <div class="panel-header">
            <h2>Members</h2>
            <button id="open-add-member" class="add-btn">+ Add</button>
          </div>
          <div id="members-list" class="list"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Chores</h2>
            <button id="open-add-chore" class="add-btn">+ Add</button>
          </div>
          <div id="chore-settings-list" class="list"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Badges</h2>
            <button id="open-add-badge" class="add-btn">+ Add</button>
          </div>
          <div id="badges-list" class="list"></div>
        </div>
      </div>
    </div>

    <p class="version">v1.3</p>
  </div>

  <!-- Add Member Modal -->
  <div id="add-member-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Add Family Member</h3>
      <form id="add-member-form" class="form-row">
        <input type="text" id="member-username" placeholder="Username" required>
        <input type="password" id="member-password" placeholder="Password" required>
        <select id="member-role">
          <option value="child">Child</option>
          <option value="parent">Parent</option>
        </select>
        <button type="submit" class="primary-btn">Create Account</button>
      </form>
      <p id="member-error" class="auth-error"></p>
      <button id="close-add-member" class="ghost-btn" style="margin-top: 12px; width: 100%;">Cancel</button>
    </div>
  </div>

  <!-- Allowance Modal -->
  <div id="allowance-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Set Weekly Allowance</h3>
      <form id="allowance-form" class="form-row">
        <input type="hidden" id="allowance-uid">
        <label style="font-size: 0.85rem; color: var(--text-dim);">Amount ($)</label>
        <input type="number" id="allowance-amount" min="0" step="0.50" required>
        <button type="submit" class="primary-btn">Save</button>
      </form>
      <button id="close-allowance" class="ghost-btn" style="margin-top: 12px; width: 100%;">Cancel</button>
    </div>
  </div>

  <!-- Chore Modal -->
  <div id="chore-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="chore-modal-title">Add Chore</h3>
      <form id="chore-form" class="form-row">
        <input type="hidden" id="chore-id">
        <input type="text" id="chore-name" placeholder="Chore name" required>
        <select id="chore-section">
          <option value="morning">Morning</option>
          <option value="evening">Evening</option>
          <option value="weekly">Weekly</option>
        </select>
        <select id="chore-frequency">
          <option value="daily">Daily</option>
          <option value="weekdays">Weekdays</option>
          <option value="weekly">Weekly</option>
          <option value="specific">Specific days</option>
        </select>
        <div id="day-selector" class="day-checks" style="display: none;">
          <label><input type="checkbox" value="0"> Su</label>
          <label><input type="checkbox" value="1"> Mo</label>
          <label><input type="checkbox" value="2"> Tu</label>
          <label><input type="checkbox" value="3"> We</label>
          <label><input type="checkbox" value="4"> Th</label>
          <label><input type="checkbox" value="5"> Fr</label>
          <label><input type="checkbox" value="6"> Sa</label>
        </div>
        <select id="chore-assign">
          <option value="all">Everyone</option>
        </select>
        <button type="submit" class="primary-btn">Save Chore</button>
      </form>
      <button id="close-chore-modal" class="ghost-btn" style="margin-top: 12px; width: 100%;">Cancel</button>
    </div>
  </div>

  <!-- Badge Modal -->
  <div id="badge-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Add Badge</h3>
      <form id="add-badge-form" class="form-row">
        <input type="text" id="badge-name" placeholder="Badge name" required>
        <input type="text" id="badge-icon" placeholder="Icon (emoji)">
        <input type="text" id="badge-desc" placeholder="Description">
        <select id="badge-type">
          <option value="totalChecks">Total chores</option>
          <option value="fullDays">Full days</option>
          <option value="streak">Streak</option>
          <option value="fullWeeks">Full weeks</option>
          <option value="perfectWeeks">Perfect weeks</option>
          <option value="totalEarned">Total earned ($)</option>
        </select>
        <input type="number" id="badge-threshold" placeholder="Threshold" min="1" required>
        <button type="submit" class="primary-btn">Add Badge</button>
      </form>
      <button id="close-badge-modal" class="ghost-btn" style="margin-top: 12px; width: 100%;">Cancel</button>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
